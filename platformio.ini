; ============================================================================
;  TP Integrador TA 4k01 - TP02/26
;  ESP32 + DHT22 + Potenciometro + LEDs + OLED + Telegram + ThingSpeak
; ============================================================================
;
;  Hay DOS "entornos" (env). Los dos compilan el MISMO codigo; solo cambian
;  dos detalles que se resuelven con build_flags:
;
;    env:wokwi      -> para simular en VS Code con la extension Wokwi.
;                      * WiFi "Wokwi-GUEST" (la red virtual del simulador)
;                      * Pantalla SSD1306 (la unica OLED 128x64 de Wokwi)
;
;    env:placa_utn  -> para grabar en la placa UTN de la catedra.
;                      * WiFi real (la que pongan en include/secrets.h)
;                      * Pantalla SH1106 (la de la placa; igual que en las practicas)
;
;  En la barra de abajo de VS Code (icono de carpeta "env:...") se elige cual usar.
; ============================================================================

[platformio]
default_envs = wokwi

; ---- Configuracion comun a los dos entornos --------------------------------
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SH110X @ ^2.1.10
    adafruit/Adafruit SSD1306 @ ^2.5.9
    witnessmenow/UniversalTelegramBot @ ^1.3.0
    bblanchon/ArduinoJson @ ^6.21.5
    mathworks/ThingSpeak @ ^2.0.0

; ---- Simulacion en Wokwi ----------------------------------------------------
[env:wokwi]
build_flags =
    -D WOKWI
    -D OLED_SSD1306

; ---- Placa UTN real -----------------------------------------------------------
[env:placa_utn]
build_flags =
    -D OLED_SH1106
